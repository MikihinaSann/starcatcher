plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

loom {
    accessWidenerPath = file("src/main/resources/starcatcher.accesswidener")

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

}

repositories {
    //fabric + minecraft libraries (required by loom for mojmap + fabric artifacts)
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://libraries.minecraft.net/"
    }

    //modrinth
    maven {
        url = "https://api.modrinth.com/maven"
    }

    //jei
    maven {
        url = "https://modmaven.dev"
    }

    //nikdo github
    maven {
        name = 'Nikdo53 Maven'
        url = 'https://nikdo53.github.io'
    }

    //wd github
    maven {
        name = 'wd Maven'
        url = 'https://wdiscute.github.io'
    }

    //sable-companion
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }

    //architectury (vinery dependency)
    maven {
        url = "https://maven.architectury.dev/"
    }

    //fuzs mods (forgeconfigapiport, needed by tiny-multiblock-lib)
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }

    //cardinal components (trinkets dependency)
    maven {
        name = "Ladysnake Mods"
        url = "https://maven.ladysnake.org/releases"
    }

    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    //tiny multiblock lib (fabric build exists)
    modImplementation "net.nikdo53:tiny-multiblock-lib-fabric-1.21.1:4.0.1"
    //real NeoForge-config port (TMBL pulls it transitively; we use its ModConfigSpec)
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.6"
    include "net.nikdo53:tiny-multiblock-lib-fabric-1.21.1:4.0.1"

    //trinkets (curios equivalent on fabric)
    modImplementation "maven.modrinth:trinkets:${trinkets_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:6.1.2"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:6.1.2"

    //EMI
    modCompileOnly "maven.modrinth:emi:${emi_version}"
    modRuntimeOnly "maven.modrinth:emi:${emi_version}"

    //JEI (fabric jar has no api classifier)
    modCompileOnly "mezz.jei:jei-${mc_version}-fabric:${jei_version}"

    //sable (Sable's compat) - compileOnly: its veil transitive isn't on a usable
    //maven; compat is ModList-guarded so the mod runs fine without it
    modCompileOnly "maven.modrinth:sable:OLG7vDD6"
    modCompileOnly "dev.ryanhcode.sable-companion:sable-companion-fabric-1.21.1:1.4.2"

    //lets-do vinery (fabric build via cursemaven) - compileOnly: its `foundation`
    //transitive dep is only published on satisfy's own maven; the compat is
    //ModList-guarded so the mod runs fine without vinery at runtime
    modCompileOnly "curse.maven:lets-do-vinery-704465:9089614"

    //architectury (vinery dependency)
    modImplementation "dev.architectury:architectury-fabric:13.0.8"

    //mixinextras (bundled by fabric-loader, explicit for compile classpath)
    implementation "io.github.llamalad7:mixinextras-fabric:0.4.1"

    //jsr305 for vendored javax.annotation usage
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
    def replaceProperties = [
            mod_id        : mod_id,
            mod_name      : mod_name,
            mod_license   : mod_license,
            mod_version   : mod_version,
            mod_authors   : mod_authors,
            version       : project.version
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
    exclude '**/*.ase', '**/*.aseprite'
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// The datagen package still targets NeoForge datagen APIs; generated resources
// are checked in, so exclude it from the Fabric compile.
sourceSets.main.java.exclude 'com/wdiscute/starcatcher/datagen/**'
sourceSets.main.java.exclude 'com/wdiscute/sellingbin/datagen/**'
sourceSets.main.java.exclude 'com/wdiscute/utils/datagen/**'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName.get()

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
